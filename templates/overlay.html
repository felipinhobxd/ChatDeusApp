<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChatDeusApp — Overlay</title><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"></head><body class="overlay-page"><main class="overlay-grid">{% for number in [1, 2, 3] %}<section class="overlay-player" id="overlay-player-{{ number }}"><div class="character-stage" id="character-stage-{{ number }}"><img class="character-img" id="character-{{ number }}" alt=""></div><div class="overlay-copy"><h2 id="user-{{ number }}">Jogador {{ number }}</h2><p id="message-{{ number }}">Aguardando mensagem...</p></div></section>{% endfor %}</main><script src="{{ url_for('static', filename='overlay.js') }}"></script></body></html>
